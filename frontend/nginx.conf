server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 모든 경로를 index.html 로 (client-side routing: / , /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 (docker-compose 서비스명 backend:8000 가정)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE (GET /api/admin/stream) 를 위한 설정: 버퍼링/캐시 비활성 + 무제한 타임아웃
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
